name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install backend deps
        run: npm ci --prefix backend
      - name: Build backend
        run: npm run build --prefix backend
      - name: Test backend
        run: npm run test --prefix backend
      - name: Install webapp deps
        run: npm ci --prefix webapp
      - name: Typecheck webapp
        run: npx tsc -p webapp/tsconfig.json --noEmit
      - name: Build webapp
        run: npm run build --prefix webapp
